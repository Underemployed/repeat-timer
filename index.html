<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Workout Timer</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.4s ease;
            overflow-x: hidden;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 2;
        }
        h1 { margin-top: 0; }
        
        /* Setup Section */
        #setup-section { display: block; }
        .track-input {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        input, select {
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        
        /* Track Inputs Flex Rules */
        .track-input input[type="text"] { flex: 2; min-width: 0; }
        .track-input input[type="number"] { flex: 1; min-width: 0; }
        .track-input select.t-color { flex: 1.5; min-width: 0; cursor: pointer; }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
            margin: 5px;
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.96); }
        .btn:hover { opacity: 0.9; }
        
        .btn-add { background: #333; border: 1px solid #555; color: white; width: 100%; margin-top: 10px; }
        .btn-start { background: #4CAF50; color: white; width: 100%; font-size: 20px; padding: 15px; margin-top: 20px;}
        .btn-pause { background: #FF9800; color: white; }
        .btn-stop { background: #f44336; color: white; }
        .btn-icon { background: rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 50%; }

        /* Fixed Form Group for Loops */
        .form-group {
            margin-top: 20px;
            text-align: left;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* Stop the loop input from stretching */
        #total-loops {
            flex: none;
            width: 70px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }

        /* Timer Section */
        #timer-section { display: none; }
        #timer-display {
            font-size: 130px;
            font-weight: bold;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        #track-name-display { font-size: 45px; margin-bottom: 5px; font-weight: 600; text-shadow: 1px 1px 4px rgba(0,0,0,0.3); }
        #sets-display { font-size: 22px; opacity: 0.9; margin-bottom: 15px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; display: inline-block;}
        
        #controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* Progress Bar */
        #progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background: rgba(0,0,0,0.3);
            display: none;
            z-index: 10;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 1s linear;
        }

        /* Track List Summary */
        #track-list { margin-top: 20px; text-align: left; }
        .track-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        .delete-btn { color: #ff5252; cursor: pointer; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div class="container" id="setup-section">
        <h1>Workout Timer</h1>
        
        <div id="tracks-container"></div>
        
        <button class="btn btn-add" onclick="addTrackInput()">+ Add Track</button>

        <div class="form-group">
            <label for="total-loops"><strong>Total Sets (Loops):</strong></label>
            <input type="number" id="total-loops" value="15" min="1">
        </div>

        <button class="btn btn-start" onclick="startWorkout()">START WORKOUT</button>

        <div id="track-list">
            <div id="track-summary"></div>
        </div>
    </div>

    <!-- TIMER SCREEN -->
    <div class="container" id="timer-section">
        <div id="sets-display">Set <span id="current-set">1</span> of <span id="total-sets">15</span></div>
        <div id="track-name-display">Get Ready!</div>
        <div id="timer-display">00:00</div>
        
        <div id="controls-row">
            <button class="btn btn-pause" id="pause-btn" onclick="togglePause()">Pause</button>
            <button class="btn btn-stop" onclick="stopWorkout()">Stop</button>
            <button class="btn btn-icon" id="mute-btn" onclick="toggleMute()" title="Toggle Sound">🔊</button>
        </div>
    </div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <script>
        let tracks = [];
        let totalLoops = 15;
        let currentLoop = 1;
        let currentTrackIndex = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let isPaused = false;
        let isMuted = false;
        let isLoading = true;
        
        // System APIs
        let wakeLock = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- PALETTE CONFIGURATION ---
        const colorPalette = [
            { name: "Green (Work)", hex: "#4CAF50" },
            { name: "Red (Rest)", hex: "#F44336" },
            { name: "Blue (Cool)", hex: "#2196F3" },
            { name: "Orange (Warn)", hex: "#FF9800" },
            { name: "Purple (Max)", hex: "#9C27B0" },
            { name: "Teal (Steady)", hex: "#00BCD4" }
        ];

        // --- COOKIE MANAGEMENT ---
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "")  + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }

        function savePreferences() {
            if(isLoading) return; // Don't save while initially loading data
            const currentTotalLoops = document.getElementById('total-loops').value;
            const data = { loops: currentTotalLoops, tracks: tracks };
            // Save/refresh cookie for 7 days
            setCookie('workoutPrefs', JSON.stringify(data), 7);
        }

        // --- AUDIO ENGINE WITH DYNAMIC PITCH VARIANCE ---
        function playBeep(baseFrequency, duration, type='sine') {
            if(isMuted) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // Randomize the maximum variance percentage (between 1% and 6%)
            const maxVariancePercent = (Math.random() * 0.05) + 0.01;
            
            // The actual variance applied is a random value within that dynamic max range
            const variance = (Math.random() * (maxVariancePercent * 2) - maxVariancePercent) * baseFrequency;
            const finalFrequency = baseFrequency + variance;
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(finalFrequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // --- WAKE LOCK (Keep screen on) ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log(`Wake Lock Error: ${err.message}`);
                }
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // --- NOTIFICATIONS ---
        function requestPermissions() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
            requestWakeLock();
        }
        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                if (document.visibilityState !== 'visible') {
                    new Notification(title, { body: body, silent: true }); 
                }
            }
        }

        // --- UI SETUP ---
        function addTrackInput(name = '', duration = 10, defaultHex = '#4CAF50') {
            const container = document.getElementById('tracks-container');
            const div = document.createElement('div');
            div.className = 'track-input';
            
            let optionsHTML = colorPalette.map(c => 
                `<option value="${c.hex}" ${c.hex === defaultHex ? 'selected' : ''}>${c.name}</option>`
            ).join('');

            div.innerHTML = `
                <input type="text" placeholder="Name" value="${name}" class="t-name">
                <input type="number" placeholder="Secs" value="${duration}" min="1" class="t-duration">
                <select class="t-color">${optionsHTML}</select>
                <span class="delete-btn" onclick="this.parentElement.remove(); updateTrackList();">✕</span>
            `;
            container.appendChild(div);
            
            div.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('input', updateTrackList);
            });
            updateTrackList();
        }

        function updateTrackList() {
            const inputs = document.querySelectorAll('.track-input');
            tracks = [];
            let summaryHTML = '';
            
            inputs.forEach(input => {
                const name = input.querySelector('.t-name').value || 'Task';
                const duration = parseInt(input.querySelector('.t-duration').value) || 10;
                const color = input.querySelector('.t-color').value;
                
                tracks.push({ name, duration, color });
                
                summaryHTML += `
                    <div class="track-item" style="border-left: 5px solid ${color}">
                        <span>${name}</span>
                        <span>${formatTime(duration)}</span>
                    </div>`;
            });
            
            document.getElementById('track-summary').innerHTML = summaryHTML;
            savePreferences(); // Save state whenever track list is updated
        }

        function formatTime(totalSeconds) {
            if (totalSeconds < 60) return totalSeconds; 
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // --- INITIALIZATION & LOADING ---
        function initApp() {
            // Listen for changes on the loops input
            document.getElementById('total-loops').addEventListener('input', savePreferences);

            const prefsCookie = getCookie('workoutPrefs');
            if (prefsCookie) {
                try {
                    const prefs = JSON.parse(prefsCookie);
                    
                    if (prefs.loops) document.getElementById('total-loops').value = prefs.loops;
                    
                    if (prefs.tracks && prefs.tracks.length > 0) {
                        prefs.tracks.forEach(t => addTrackInput(t.name, t.duration, t.color));
                    } else {
                        loadDefaults();
                    }
                } catch(e) {
                    loadDefaults();
                }
            } else {
                loadDefaults();
            }
            
            isLoading = false; // Allow saving preferences from now on
            savePreferences(); // Refresh the 7-day expiration right away
        }

        function loadDefaults() {
            addTrackInput('Work', 10, '#4CAF50'); // Default Green (10s)
            addTrackInput('Rest', 5, '#F44336');  // Default Red (5s)
            document.getElementById('total-loops').value = 15;
        }

        window.onload = initApp;

        // --- TIMER LOGIC ---
        function startWorkout() {
            updateTrackList();
            if(tracks.length === 0) return alert("Please add at least one track!");

            requestPermissions();

            totalLoops = parseInt(document.getElementById('total-loops').value) || 15;
            
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('timer-section').style.display = 'block';
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('total-sets').innerText = totalLoops;

            currentLoop = 1;
            currentTrackIndex = 0;
            isPaused = false;
            document.getElementById('pause-btn').innerText = "Pause";
            
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            loadTrack();
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
            playBeep(600, 0.5); // Initial Beep
        }

        function loadTrack() {
            const track = tracks[currentTrackIndex];
            timeLeft = track.duration;
            
            document.getElementById('current-set').innerText = currentLoop;
            document.getElementById('track-name-display').innerText = track.name;
            document.getElementById('timer-display').innerText = formatTime(timeLeft);
            document.body.style.backgroundColor = track.color;
            
            sendNotification(`Set ${currentLoop}: ${track.name}`, `${formatTime(track.duration)} on the clock.`);
            updateProgressBar();
        }

        function tick() {
            if (isPaused) return;

            timeLeft--;
            updateProgressBar();

            if (timeLeft > 0 && timeLeft <= 3) {
                playBeep(440, 0.2); 
            }

            if (timeLeft <= 0) {
                currentTrackIndex++;
                
                if (currentTrackIndex >= tracks.length) {
                    currentTrackIndex = 0;
                    currentLoop++;
                    
                    if (currentLoop > totalLoops) {
                        finishWorkout();
                        return;
                    }
                }
                
                playBeep(880, 0.4);
                loadTrack();
            } else {
                document.getElementById('timer-display').innerText = formatTime(timeLeft);
            }
        }

        function updateProgressBar() {
            const track = tracks[currentTrackIndex];
            if (!track) return;
            const percentage = ((track.duration - timeLeft) / track.duration) * 100;
            document.getElementById('progress-bar').style.width = percentage + '%';
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? "Resume" : "Pause";
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
        }

        function finishWorkout() {
            clearInterval(timerInterval);
            releaseWakeLock();
            
            document.getElementById('track-name-display').innerText = "Workout Complete!";
            document.getElementById('timer-display').innerText = "🎉";
            document.getElementById('progress-bar').style.width = '100%';
            document.body.style.backgroundColor = "#2196F3";
            
            sendNotification("Workout Complete!", "Great job!");

            playBeep(523.25, 0.2);
            setTimeout(() => playBeep(659.25, 0.2), 200);
            setTimeout(() => playBeep(783.99, 0.4), 400);
        }

        function stopWorkout() {
            clearInterval(timerInterval);
            releaseWakeLock();
            document.body.style.backgroundColor = "var(--bg-color)";
            document.getElementById('setup-section').style.display = 'block';
            document.getElementById('timer-section').style.display = 'none';
            document.getElementById('progress-container').style.display = 'none';
        }
    </script>
</body>
</html>
